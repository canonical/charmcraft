summary: create-lib exits with an error pointing to the deprecation notice

include:
  - tests/

execute: |
  # New libraries can no longer be registered on Charmhub, so create-lib
  # is now a stub that fails early with a pointer to more information.
  if charmcraft create-lib some_lib 2> create-lib-error.txt; then
    echo "charmcraft create-lib should have failed" >&2
    exit 1
  fi
  grep -Fq "New libraries can no longer be registered on Charmhub." create-lib-error.txt
  grep -Fq "https://ubu.link/charmhub-libraries-deprecation" create-lib-error.txt
