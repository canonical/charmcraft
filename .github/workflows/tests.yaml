name: Tests

on:
  push:
    branches:
      - main
      - "feature/**"
      - "hotfix/**"
    paths-ignore:
      - .github/**
      - "!.github/workflows/tests.yaml" # Run on this file getting changed
      - docs/**
      - schema/**
      - tests/spread/**
      - .editorconfig
      - .pre-commit-config.yaml
      - .readthedocs.yaml
      - "**/*.md"
      - "*.md"
      - spread.yaml

  pull_request:
    paths-ignore:
      - .github/**
      - "!.github/workflows/tests.yaml" # Run on this file getting changed
      - docs/**
      - schema/**
      - tests/spread/**
      - .editorconfig
      - .pre-commit-config.yaml
      - .readthedocs.yaml
      - "**/*.md"
      - "*.md"
      - spread.yaml
  merge_group:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  snap-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build snap
        uses: canonical/action-build@v1
        id: snapcraft
      - name: Upload snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: snap
          path: ${{ steps.snapcraft.outputs.snap }}

  snap-publish:
    needs: [snap-build]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Download snap artifact
        uses: actions/download-artifact@v8
        with:
          name: snap
          path: snap-artifacts
      - name: Get snap filename
        id: snap-name
        run: |
          echo "snap=$(find . -type f -name '*.snap')" >> "$GITHUB_OUTPUT"
      - name: Publish feature branch to edge/pr-${{ github.event.number }}
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: canonical/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap-name.outputs.snap }}
          release: edge/pr-${{ github.event.number }}

  # libgit2 comes from the pygit2 macOS wheel (vendored), not Homebrew.
  # See: https://github.com/canonical/charmcraft/issues/2605
  macos-smoke-test:
    strategy:
      matrix:
        os: [macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      # Installing and caching homebrew using the action should speed up subsequent CI:
      # https://github.com/Homebrew/actions/tree/main/setup-homebrew
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@9f17989bd508c794353d974d1756f23b0bcf10c1 # main
      - name: Cache Homebrew Bundler RubyGems
        id: cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-
      - name: Install Homebrew Bundler RubyGems
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install-bundler-gems
      - name: Install dependencies with homebrew
        run: brew install --cask multipass
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv with caching
        id: setup-uv
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Build and install Charmcraft
        run: |
          uv sync --no-dev
      - name: Verify pygit2 wheel vendors libgit2
        run: |
          source .venv/bin/activate
          python -c "
          import pathlib
          import pygit2

          dylibs = pathlib.Path(pygit2.__file__).parent / '.dylibs'
          assert dylibs.is_dir(), 'expected vendored libgit2 from a pygit2 wheel'
          print(f'pygit2 {pygit2.__version__} libgit2 {pygit2.LIBGIT2_VERSION}')
          "
      - name: Check for fully-configured multipass
        run: |
          echo Waiting until Multipass is up...
          while ! multipass list; do
            sleep 1
          done
          echo Updating multipass remotes...
          multipass find --force-update
      - name: Configure runner to run multipass as root
        # Workaround for https://github.com/canonical/multipass/issues/4588
        # https://github.com/lengau/setup-multipass/blob/d7ac69cac08d7d82da2518868b1ffe742a607e33/action.yaml#L35-L46
        run: |
          multipass_passphrase=$(uuidgen)
          multipass set local.passphrase="$multipass_passphrase"
          while ! sudo multipass authenticate "$multipass_passphrase"; do
            sleep 1
          done
          sudo mv /usr/local/bin/multipass /usr/local/bin/multipass-real
          printf '#!/bin/bash\nexec /usr/bin/sudo -E /usr/local/bin/multipass-real $@' | sudo tee /usr/local/bin/multipass
          sudo chmod a+x /usr/local/bin/multipass
      - name: Init and pack
        run: |
          source .venv/bin/activate
          mkdir test-charm
          cd test-charm
          export CRAFT_VERBOSITY_LEVEL=trace
          charmcraft init --profile=machine
          # Machine profile uses the uv plugin, which requires a lockfile to pack.
          uv lock
          charmcraft pack
          test -f ./*.charm
