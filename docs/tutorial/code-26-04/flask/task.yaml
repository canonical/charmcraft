###########################################
# IMPORTANT
# Comments matter!
# The docs use the wrapping comments as
# markers for including said instructions
# as snippets in the docs.
###########################################
summary: Getting started with Flask tutorial on Ubuntu 26.04

kill-timeout: 50m

restore: |
  rm -rf $HOME/flask
  juju destroy-model flask-hello-world \
  --destroy-storage --no-prompt --force || true

environment:

execute: |
  NODE_IP=$(sudo k8s kubectl get nodes \
    -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
  REGISTRY="localhost:32000"

  # [docs:export-experimental-env-vars]
  export ROCKCRAFT_ENABLE_EXPERIMENTAL_EXTENSIONS=1
  export CHARMCRAFT_ENABLE_EXPERIMENTAL_EXTENSIONS=1
  # [docs:export-experimental-env-vars-end]

  # Move everything to $HOME so that Juju deployment works
  mkdir $HOME/flask
  mv *.yaml *.py *.txt $HOME/flask
  cd $HOME/flask

  # Don't use the staging store for this test
  unset CHARMCRAFT_STORE_API_URL
  unset CHARMCRAFT_UPLOAD_URL
  unset CHARMCRAFT_REGISTRY_URL

  # [docs:create-venv]
  sudo apt update && sudo apt install python3-venv -y
  python3 -m venv .venv
  source .venv/bin/activate
  # [docs:create-venv-end]

  # [docs:install-requirements]
  pip install -r requirements.txt
  # [docs:install-requirements-end]

  flask run -p 8000 &
  retry -n 5 --wait 2 curl --fail localhost:8000

  # [docs:curl-flask]
  curl localhost:8000
  # [docs:curl-flask-end]

  kill $!

  # [docs:create-rockcraft-yaml]
  rockcraft init --profile flask-framework --base ubuntu@26.04
  # [docs:create-rockcraft-yaml-end]

  # [docs:use-ubuntu-rock-base]
  sed -i 's/^base: bare.*/base: ubuntu@26.04/; /^build-base:/d' rockcraft.yaml
  # [docs:use-ubuntu-rock-base-end]

  sed -i "s/name: .*/name: flask-hello-world/g" rockcraft.yaml
  sed -i "s/amd64/$(dpkg --print-architecture)/g" rockcraft.yaml

  # [docs:pack]
  rockcraft pack
  # [docs:pack-end]

  # [docs:skopeo-copy]
  rockcraft.skopeo copy \
    --insecure-policy \
    --dest-tls-verify=false \
    oci-archive:flask-hello-world_0.1_$(dpkg --print-architecture).rock \
    docker://${REGISTRY}/flask-hello-world:0.1
  # [docs:skopeo-copy-end]

  # [docs:create-charm-dir]
  mkdir charm
  cd charm
  # [docs:create-charm-dir-end]

  # [docs:charm-init]
  charmcraft init --profile flask-framework --name flask-hello-world --base ubuntu@26.04
  # [docs:charm-init-end]

  # [docs:lock-charm-dependencies]
  sudo snap install astral-uv --classic
  uv lock
  # [docs:lock-charm-dependencies-end]

  cp ../paas-config.yaml .

  # [docs:charm-pack]
  charmcraft pack
  # [docs:charm-pack-end]

  # [docs:add-juju-model]
  juju add-model flask-hello-world
  # [docs:add-juju-model-end]

  #[docs:add-model-constraints]
  juju set-model-constraints -m flask-hello-world arch=$(dpkg --print-architecture)
  #[docs:add-model-constraints-end]

  # [docs:deploy-flask-app]
  juju deploy \
    ./flask-hello-world_$(dpkg --print-architecture).charm \
    flask-hello-world --resource \
    app-image=${REGISTRY}/flask-hello-world:0.1
  # [docs:deploy-flask-app-end]

  # [docs:deploy-gateway]
  juju deploy gateway-api-integrator --channel=1/edge --trust
  juju integrate gateway-api-integrator flask-hello-world
  # [docs:deploy-gateway-end]

  # [docs:config-gateway]
  juju config gateway-api-integrator \
    gateway-class=ck-gateway external-hostname=flask-hello-world.internal enforce-https=false
  # [docs:config-gateway-end]

  # give Juju some time to deploy the apps
  juju wait-for application flask-hello-world --query='status=="active"' --timeout 10m
  juju wait-for application gateway-api-integrator --query='status=="active"' --timeout 10m

  # wait until the endpoint works
  retry -n 5 --wait 5 curl --fail http://flask-hello-world.internal/flask-hello-world-flask-hello-world --resolve flask-hello-world.internal:80:$NODE_IP

  # [docs:curl-init-deployment]
  curl http://flask-hello-world.internal/flask-hello-world-flask-hello-world --resolve flask-hello-world.internal:80:$NODE_IP
  # [docs:curl-init-deployment-end]

  cd ..
  cat greeting_app.py > app.py
  sed -i "s/version: .*/version: 0.2/g" rockcraft.yaml

  # [docs:docker-update]
  rockcraft pack
  rockcraft.skopeo --insecure-policy copy --dest-tls-verify=false \
    oci-archive:flask-hello-world_0.2_$(dpkg --print-architecture).rock \
    docker://${REGISTRY}/flask-hello-world:0.2
  # [docs:docker-update-end]

  cat greeting_charmcraft.yaml >> ./charm/charmcraft.yaml
  cd charm
  cp ../greeting_paas_config.yaml paas-config.yaml

  # [docs:refresh-deployment]
  charmcraft pack
  juju refresh flask-hello-world \
    --path=./flask-hello-world_$(dpkg --print-architecture).charm \
    --resource app-image=${REGISTRY}/flask-hello-world:0.2
  # [docs:refresh-deployment-end]

  # give Juju some time to refresh the app
  juju wait-for application flask-hello-world --query='status=="active"' --timeout 10m

  # curl and check that the response is Hello
  retry -n 5 --wait 5 sh -c "curl http://flask-hello-world.internal/flask-hello-world-flask-hello-world --resolve flask-hello-world.internal:80:$NODE_IP | grep Hello"

  # [docs:change-config]
  juju config flask-hello-world greeting='Hi!'
  # [docs:change-config-end]

  # make sure that the application updates
  juju wait-for application flask-hello-world --query='status=="active"' --timeout 10m

  # curl and check that the response is now Hi
  retry -n 5 --wait 5 sh -c "curl http://flask-hello-world.internal/flask-hello-world-flask-hello-world --resolve flask-hello-world.internal:80:$NODE_IP | grep Hi"

  cd ..
  cat visitors_migrate.py >> migrate.py
  cat visitors_app.py > app.py
  sed -i "s/version: .*/version: 0.3/g" rockcraft.yaml

  # [docs:docker-2nd-update]
  rockcraft pack
  rockcraft.skopeo --insecure-policy copy --dest-tls-verify=false \
    oci-archive:flask-hello-world_0.3_$(dpkg --print-architecture).rock \
    docker://${REGISTRY}/flask-hello-world:0.3
  # [docs:docker-2nd-update-end]

  cat visitors_charmcraft.yaml >> ./charm/charmcraft.yaml
  cd charm

  # [docs:refresh-2nd-deployment]
  charmcraft pack
  juju refresh flask-hello-world \
    --path=./flask-hello-world_$(dpkg --print-architecture).charm \
    --resource app-image=${REGISTRY}/flask-hello-world:0.3
  # [docs:refresh-2nd-deployment-end]

  # In the relation with postgresql-k8s test we may hit, so we have to wait before integrating.
  # https://github.com/canonical/postgresql-k8s-operator/issues/1011

  # [docs:deploy-postgres]
  juju deploy postgresql-k8s --trust --channel 14/edge
  juju integrate flask-hello-world postgresql-k8s
  # [docs:deploy-postgres-end]

  # give Juju some time to deploy and refresh the apps
  juju wait-for application postgresql-k8s --query='status=="active"' --timeout 30m | juju status --relations
  juju wait-for application flask-hello-world --query='status=="active"' --timeout 30m | juju status --relations

  juju status --relations

  # wait until the endpoint works
  retry -n 5 --wait 5 curl --fail http://flask-hello-world.internal/flask-hello-world-flask-hello-world/visitors --resolve flask-hello-world.internal:80:$NODE_IP

  curl http://flask-hello-world.internal/flask-hello-world-flask-hello-world --resolve flask-hello-world.internal:80:$NODE_IP | grep Hi
  curl http://flask-hello-world.internal/flask-hello-world-flask-hello-world/visitors --resolve flask-hello-world.internal:80:$NODE_IP | grep 1
  curl http://flask-hello-world.internal/flask-hello-world-flask-hello-world --resolve flask-hello-world.internal:80:$NODE_IP | grep Hi
  curl http://flask-hello-world.internal/flask-hello-world-flask-hello-world/visitors --resolve flask-hello-world.internal:80:$NODE_IP | grep 2

  # [docs:clean-environment]
  charmcraft clean
  # Back out to main directory for cleanup
  cd ..
  rockcraft clean
  # exit and delete the virtual environment
  deactivate
  rm -rf charm .venv __pycache__
  # delete all the files created during the tutorial
  rm flask-hello-world_0.1_$(dpkg --print-architecture).rock \
    flask-hello-world_0.2_$(dpkg --print-architecture).rock \
    flask-hello-world_0.3_$(dpkg --print-architecture).rock \
    rockcraft.yaml app.py requirements.txt migrate.py
  # Remove the juju model
  juju destroy-model flask-hello-world --destroy-storage --no-prompt --force
  # [docs:clean-environment-end]
