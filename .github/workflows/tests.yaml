name: Tests

on:
  workflow_call:
    inputs:
      run:
        type: boolean
        required: true
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS:
        required: false

permissions:
  contents: read

jobs:
  snap-publish:
    runs-on: ubuntu-latest
    if: ${{ inputs.run && github.event_name == 'pull_request' }}
    steps:
      - name: Download snap artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snap
          path: snap-artifacts
      - name: Get snap filename
        id: snap-name
        run: |
          echo "snap=$(find snap-artifacts -type f -name '*.snap')" >> "$GITHUB_OUTPUT"
      - name: Publish feature branch to edge/pr-${{ github.event.pull_request.number }}
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: canonical/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap-name.outputs.snap }}
          release: edge/pr-${{ github.event.pull_request.number }}
