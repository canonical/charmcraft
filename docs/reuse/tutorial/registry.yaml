apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: container-registry
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: registry
      namespace: container-registry
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: registry
      template:
        metadata:
          labels:
            app: registry
        spec:
          containers:
            - name: registry
              image: registry:2.8.3
              ports:
                - containerPort: 5000
              readinessProbe:
                httpGet:
                  path: /v2/
                  port: 5000
  - apiVersion: v1
    kind: Service
    metadata:
      name: registry
      namespace: container-registry
    spec:
      type: NodePort
      selector:
        app: registry
      ports:
        - port: 5000
          targetPort: 5000
          nodePort: 32000
