name: Spread tests for docs

on:
  workflow_call:
    inputs:
      run:
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  spread-select:
    if: ${{ inputs.run }}
    runs-on: spread-enabled
    outputs:
      systems: ${{ steps.select.outputs.systems }}
    steps:
      - name: Checkout charmcraft
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: Find spread systems
        id: select
        run: |
          echo systems="$(spread -list ci:docs/ | jq --raw-input . | jq --slurp --compact-output)" | tee -a "${GITHUB_OUTPUT}"

  docs-tests:
    if: ${{ inputs.run }}
    runs-on: [self-hosted, linux, amd64, noble, large]
    needs: [spread-select]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(needs.spread-select.outputs.systems) }}

    steps:
      - name: Fix network issues related to docker and lxd
        run: |
          sudo iptables -P FORWARD ACCEPT
          sudo ip6tables -P FORWARD ACCEPT

      - name: Checkout charmcraft
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Cleanup job workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir "${{ github.workspace }}"

      - name: Checkout charmcraft
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Download snap artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snap

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.26

      - name: Install spread
        run: |
          go install github.com/canonical/spread/cmd/spread@latest

      - name: Run spread
        env:
          SPREAD_SYSTEM: ${{ matrix.system }}
        run: |
          "$(go env GOPATH)/bin/spread" "${SPREAD_SYSTEM}"

      - name: Discard spread workers
        if: always()
        run: |
          shopt -s nullglob
          for r in .spread-reuse.*.yaml; do
            spread -discard -reuse-pid="$(echo "$r" | grep -o -E '[0-9]+')"
          done
