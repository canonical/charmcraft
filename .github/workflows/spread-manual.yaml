name: Spread (manual - large/flaky)

on:
  workflow_call:
    inputs:
      run:
        type: boolean
        required: true
    secrets:
      LAUNCHPAD_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  predicate:
    if: ${{ inputs.run }}
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.eval.outputs.should_run }}
    steps:
      - id: eval
        run: |
          should_run=${{ contains(github.event.pull_request.labels.*.name, 'PR: Run Manual Spread') || contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name) }}
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  spread:
    needs: predicate
    if: ${{ inputs.run && needs.predicate.outputs.should_run == 'true' }}
    runs-on: spread-installed
    strategy:
      fail-fast: false
      # Each of these tasks can spin up several machines in spread.
      max-parallel: 2
      matrix:
        task:
          - charms/k8s-operator
          - charms/operator
          - charms/reactive
          - smoketests/parallel-build
          - smoketests/remote-build

    steps:
      - name: Cleanup job workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir "${{ github.workspace }}"
      - name: Checkout charmcraft
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: Download snap artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snap
      - name: Spread k8s operator
        env:
          LAUNCHPAD_TOKEN: ${{ secrets.LAUNCHPAD_TOKEN }}
          SPREAD_TASK: ${{ matrix.task }}
        run: |
          spread "google:tests/spread/${SPREAD_TASK}"
      - name: Clean up jobs
        if: ${{ always() }}
        run: |
          spread -discard
          shopt -s nullglob
          for r in .spread-reuse.*.yaml; do
            spread -discard -reuse-pid="$(echo "$r" | grep -o -E '[0-9]+')"
          done
