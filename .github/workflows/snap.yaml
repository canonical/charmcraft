name: Snap

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  push:
    branches:
      - main
      - "feature/**"
      - "hotfix/**"
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */2 * *"
    - cron: "0 0 * * 0"
    - cron: "0 0 * * WED,SUN"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    runs-on: ubuntu-slim
    outputs:
      run-pack: ${{ steps.eval.outputs.run-pack }}
      run-publish: ${{ steps.eval.outputs.run-publish }}
      run-spread-source: ${{ steps.eval.outputs.run-spread-source }}
      run-spread-store: ${{ steps.eval.outputs.run-spread-store }}
      run-spread-docs: ${{ steps.eval.outputs.run-spread-docs }}
      run-spread-manual: ${{ steps.eval.outputs.run-spread-manual }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter changed paths
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            spread:
              - '!({.github/**,docs/**,schema/**,tests/**,.editorconfig,.pre-commit-config.yaml,.readthedocs.yaml,*.md,**/*.md})'
              - 'tests/spread/**'
              - '.github/workflows/snap.yaml'
              - '.github/workflows/spread.yaml'
            docs:
              - '.github/workflows/snap.yaml'
              - '.github/workflows/spread.yaml'
              - 'spread.yaml'
              - '.readthedocs.yaml'
              - 'docs/**/code/**'
            manual:
              - '.github/workflows/snap.yaml'
              - '.github/workflows/spread.yaml'
              - 'tests/spread/charms/**'
              - 'tests/spread/smoketests/parallel-build/*'
              - 'tests/spread/smoketests/remote-build/*'

      - name: Evaluate workflow triggers
        id: eval
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          SCHEDULE: ${{ github.event.schedule }}
          FILTER_SPREAD: ${{ steps.filter.outputs.spread }}
          FILTER_DOCS: ${{ steps.filter.outputs.docs }}
          FILTER_MANUAL: ${{ steps.filter.outputs.manual }}
          HAS_MANUAL_LABEL: "${{ contains(github.event.pull_request.labels.*.name, 'PR: Run Manual Spread') }}"
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
        run: |
          run_spread_source=false
          run_spread_store=false
          run_spread_docs=false
          run_spread_manual=false
          run_publish=false

          case "$EVENT_NAME" in
            pull_request)
              [ "$FILTER_SPREAD" = "true" ] && run_spread_source=true
              [ "$FILTER_DOCS" = "true" ] && run_spread_docs=true
              [ "$HAS_MANUAL_LABEL" = "true" ] && [ "$FILTER_MANUAL" = "true" ] && run_spread_manual=true
              [ -n "$SNAPCRAFT_STORE_CREDENTIALS" ] && run_publish=true
              ;;
            push)
              if [ "$GITHUB_REF" = "refs/heads/main" ]; then
                [ "$FILTER_SPREAD" = "true" ] && run_spread_source=true
                [ "$FILTER_DOCS" = "true" ] && run_spread_docs=true
              fi
              ;;
            merge_group)
              run_spread_source=true
              ;;
            workflow_dispatch)
              run_spread_manual=true
              ;;
            schedule)
              case "$SCHEDULE" in
                "0 0 */2 * *") run_spread_source=true ;;
                "0 0 * * 0") run_spread_docs=true ;;
                "0 0 * * WED,SUN") run_spread_manual=true ;;
              esac
              ;;
          esac

          run_pack=false
          if [ "$run_spread_source" = "true" ] || [ "$run_spread_docs" = "true" ] || [ "$run_spread_manual" = "true" ] || [ "$run_publish" = "true" ]; then
            run_pack=true
          fi

          if [ "$run_spread_source" = "true" ] && [ -n "$CHARMCRAFT_AUTH" ]; then
            run_spread_store=true
          fi

          {
            echo "run-pack=$run_pack"
            echo "run-publish=$run_publish"
            echo "run-spread-source=$run_spread_source"
            echo "run-spread-store=$run_spread_store"
            echo "run-spread-docs=$run_spread_docs"
            echo "run-spread-manual=$run_spread_manual"
          } >> "$GITHUB_OUTPUT"

  pack:
    needs: filter
    if: needs.filter.outputs.run-pack == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use wheels
        run: |
          yq e 'del(.parts.charmcraft."build-environment"[] | select(.UV_NO_BINARY == "true"))' -i snap/snapcraft.yaml
      - name: Pack snap
        uses: canonical/craft-actions/snapcraft/pack@5d072661cd0e3a60ad1b79d6ba93db88344e2b5b # v1
        id: snapcraft
      - name: Upload snap artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snap
          path: ${{ steps.snapcraft.outputs.snaps }}

  publish:
    needs: [filter, pack]
    if: needs.filter.outputs.run-publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download snap artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snap
          path: snap-artifacts
      - name: Get snap filename
        id: snap-name
        run: |
          echo "snap=$(find snap-artifacts -type f -name '*.snap')" >> "$GITHUB_OUTPUT"
      - name: Publish feature branch to edge/pr-${{ github.event.pull_request.number }}
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: canonical/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap-name.outputs.snap }}
          release: edge/pr-${{ github.event.pull_request.number }}

  spread:
    needs: [filter, pack]
    if: always() && needs.pack.result != 'failure' && needs.pack.result != 'cancelled'
    uses: ./.github/workflows/spread.yaml
    with:
      source: ${{ needs.filter.outputs.run-spread-source == 'true' }}
      store: ${{ needs.filter.outputs.run-spread-store == 'true' }}
      docs: ${{ needs.filter.outputs.run-spread-docs == 'true' }}
      manual: ${{ needs.filter.outputs.run-spread-manual == 'true' }}
    secrets:
      CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
      CHARMCRAFT_SINGLE_CHARM_AUTH: ${{ secrets.CHARMCRAFT_SINGLE_CHARM_AUTH }}
      STAGING_SSO_PASSWORD: ${{ secrets.STAGING_SSO_PASSWORD }}
      LAUNCHPAD_TOKEN: ${{ secrets.LAUNCHPAD_TOKEN }}
