apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: charm-tutorial-registry
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: registry-data
      namespace: charm-tutorial-registry
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 8Gi
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: registry
      namespace: charm-tutorial-registry
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: registry
      template:
        metadata:
          labels:
            app: registry
        spec:
          containers:
            - name: registry
              image: registry:3
              ports:
                - containerPort: 5000
              readinessProbe:
                httpGet:
                  path: /v2/
                  port: 5000
              volumeMounts:
                - name: registry-data
                  mountPath: /var/lib/registry
          volumes:
            - name: registry-data
              persistentVolumeClaim:
                claimName: registry-data
  - apiVersion: v1
    kind: Service
    metadata:
      name: registry
      namespace: charm-tutorial-registry
    spec:
      type: NodePort
      selector:
        app: registry
      ports:
        - port: 5000
          targetPort: 5000
          nodePort: 32000
