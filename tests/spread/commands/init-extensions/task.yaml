summary: test charmcraft init with framework profiles
priority: 500 # This builds pydantic, so do it early
kill-timeout: 75m # Because it builds pydantic, it takes a long time.
systems:
  # We only need to run this test once, and it takes a long time.
  - ubuntu-26.04-64
environment:
  PROFILE/flask_ubuntu_24_04,flask_ubuntu_26_04: flask-framework
  PROFILE/django_ubuntu_24_04,django_ubuntu_26_04: django-framework
  PROFILE/go_ubuntu_24_04,go_ubuntu_26_04: go-framework
  PROFILE/fastapi_ubuntu_24_04,fastapi_ubuntu_26_04: fastapi-framework
  PROFILE/expressjs_ubuntu_24_04,expressjs_ubuntu_26_04: expressjs-framework
  PROFILE/springboot_ubuntu_24_04,springboot_ubuntu_26_04: spring-boot-framework
  BASE/flask_ubuntu_24_04,django_ubuntu_24_04,go_ubuntu_24_04,fastapi_ubuntu_24_04,expressjs_ubuntu_24_04,springboot_ubuntu_24_04: ubuntu@24.04
  BASE/flask_ubuntu_26_04,django_ubuntu_26_04,go_ubuntu_26_04,fastapi_ubuntu_26_04,expressjs_ubuntu_26_04,springboot_ubuntu_26_04: ubuntu@26.04
  CHARMCRAFT_ENABLE_EXPERIMENTAL_EXTENSIONS: "true"

prepare: |
  tests.pkgs install pipx python3-venv
  pipx install --force tox

restore: |
  pushd test-init
  charmcraft clean
  popd

  rm -rf test-init

execute: |
  # Required for fetch-libs to succeed since the libraries are not available on
  # the staging environment
  unset CHARMCRAFT_STORE_API_URL
  unset CHARMCRAFT_UPLOAD_URL
  unset CHARMCRAFT_REGISTRY_URL

  mkdir -p test-init
  cd test-init
  charmcraft init --profile "${PROFILE}" --name hello-world --base "${BASE}"
  charmcraft fetch-libs
  charmcraft pack --verbose
  test -f *.charm

  # expand charmcraft.yaml for the scenario tests to work
  charmcraft expand-extensions > charmcraft-expanded.yaml
  mv charmcraft-expanded.yaml charmcraft.yaml
  ~/.local/bin/tox -c ../tox.ini -e unit
