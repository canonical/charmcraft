name: Spread

on:
  workflow_call:
    inputs:
      run:
        type: boolean
        required: true
      targets:
        type: string
        required: true
      timeout-minutes:
        type: number
        required: false
        default: 360
      env:
        type: string
        required: false
        default: "{}"
    secrets:
      env:
        required: false

permissions:
  contents: read

jobs:
  spread:
    if: ${{ inputs.run }}
    runs-on: [self-hosted, spread-enabled]
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}

    steps:
      - name: Cleanup job workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir "${{ github.workspace }}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Download snap artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snap

      - name: Export spread environment
        env:
          SPREAD_ENV: ${{ inputs.env }}
          SPREAD_SECRET_ENV: ${{ secrets.env }}
        run: |
          jq -r 'to_entries[] | select(.value != null and .value != "") | "\(.key)=\(.value)"' <<< "$SPREAD_ENV" >> "$GITHUB_ENV"
          if [ -n "$SPREAD_SECRET_ENV" ]; then
            while IFS='=' read -r key val; do
              echo "::add-mask::$val"
              echo "$key=$val" >> "$GITHUB_ENV"
            done < <(jq -r 'to_entries[] | select(.value != null and .value != "") | "\(.key)=\(.value)"' <<< "$SPREAD_SECRET_ENV")
          fi

      - name: Run spread
        env:
          SPREAD_TARGET: ${{ matrix.target }}
        run: |
          spread "${SPREAD_TARGET}"

      - name: Discard spread workers
        if: always()
        run: |
          spread -discard
          shopt -s nullglob
          for r in .spread-reuse.*.yaml; do
            spread -discard -reuse-pid="$(echo "$r" | grep -o -E '[0-9]+')"
          done
