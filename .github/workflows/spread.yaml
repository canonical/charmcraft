name: Spread

on:
  workflow_call:
    inputs:
      run:
        type: boolean
        required: true
      targets:
        type: string
        required: true
      runs-on:
        type: string
        required: false
        default: '["self-hosted", "spread-enabled"]'
      max-parallel:
        type: number
        required: false
        default: 256
      timeout-minutes:
        type: number
        required: false
        default: 360
    secrets:
      CHARMCRAFT_AUTH:
        required: false
      CHARMCRAFT_SINGLE_CHARM_AUTH:
        required: false
      STAGING_SSO_PASSWORD:
        required: false
      LAUNCHPAD_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  spread:
    if: ${{ inputs.run }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        target: ${{ fromJSON(inputs.targets) }}

    steps:
      - name: Cleanup job workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir "${{ github.workspace }}"

      - name: Checkout charmcraft
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Download snap artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snap

      - name: Run spread
        env:
          SPREAD_TARGET: ${{ matrix.target }}
          CHARMCRAFT_AUTH: ${{ secrets.CHARMCRAFT_AUTH }}
          CHARMCRAFT_SINGLE_CHARM_AUTH: ${{ secrets.CHARMCRAFT_SINGLE_CHARM_AUTH }}
          CHARM_DEFAULT_NAME: gh-ci-charmcraft-charm
          STAGING_SSO_USERNAME: ${{ vars.STAGING_SSO_USERNAME }}
          STAGING_SSO_PASSWORD: ${{ secrets.STAGING_SSO_PASSWORD }}
          CHARMCRAFT_STORE_SSO_URL: https://login.staging.ubuntu.com
          LAUNCHPAD_TOKEN: ${{ secrets.LAUNCHPAD_TOKEN }}
        run: |
          spread "${SPREAD_TARGET}"

      - name: Discard spread workers
        if: always()
        run: |
          spread -discard
          shopt -s nullglob
          for r in .spread-reuse.*.yaml; do
            spread -discard -reuse-pid="$(echo "$r" | grep -o -E '[0-9]+')"
          done
